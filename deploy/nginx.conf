server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ---- Security headers ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # CSP: scripts may NOT run inline (blocks reflected/stored XSS), while frame-src https:
  # permits the sandboxed iframes used by embedded widgets. That pairing is what lets a tenant
  # embed arbitrary third-party pages without those pages being able to touch the CRM session.
  # 'unsafe-inline' for style-src is currently required by inline style attributes in the app;
  # tighten it once styles are fully externalised.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:4000; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # ---- Caching ----
  # Hashed asset filenames are immutable and can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  # The entry document must never be cached, or users keep running a stale bundle after deploys
  # (exactly the "my UI looks old" class of problem).
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # SPA fallback — client-side routing (react-router) handles the rest
  location / {
    try_files $uri /index.html;
  }
}
